# Maps source categories to shared category groups.
# Lookup order: exact match in `sources.<source>` -> keyword match in `keywords` -> default_group.
# Group display names are used for Gmail labels (Leads/Category/<display name>) and the Sheet.

default_group: other

groups:
  food_drink: "Food & Drink"
  retail: "Retail"
  beauty_wellness: "Beauty & Wellness"
  health_medical: "Health & Medical"
  trades_construction: "Trades & Construction"
  home_services: "Home Services"
  automotive: "Automotive"
  professional_services: "Professional Services"
  hospitality: "Hotels & Lodging"
  fitness_sports: "Fitness & Sports"
  education: "Education"
  real_estate: "Real Estate"
  pets: "Pets"
  events_entertainment: "Events & Entertainment"
  other: "Other"

# Exact (lower-cased) category values per source. TODO: extend from real data.
sources:
  overture:
    restaurant: food_drink
    cafe: food_drink
    coffee_shop: food_drink
    bakery: food_drink
    bar: food_drink
    beauty_salon: beauty_wellness
    hair_salon: beauty_wellness
    barber: beauty_wellness
    nail_salon: beauty_wellness
    dentist: health_medical
    plumbing: trades_construction
    electrician: trades_construction
    automotive_repair: automotive
    car_dealer: automotive
    accountant: professional_services
    lawyer: professional_services
    hotel: hospitality
    gym: fitness_sports
    real_estate_agent: real_estate
    pet_groomer: pets
    veterinarian: pets
  foursquare:
    "dining and drinking > restaurant": food_drink
    "dining and drinking > cafe, coffee, and tea house": food_drink
    "retail": retail
    "health and medicine > dentist": health_medical
  osm:
    "amenity=restaurant": food_drink
    "amenity=cafe": food_drink
    "shop=hairdresser": beauty_wellness
    "shop=car_repair": automotive
    "craft=plumber": trades_construction
    "craft=electrician": trades_construction

# Fallback: first group with a keyword in the category text. Words of up to four letters
# match whole words, longer ones the start of a word. Order matters: "nail bar" is beauty.
keywords:
  beauty_wellness: [beauty, salon, hair, hairdress, barber, nail, spa, massage, cosmetic, tattoo, tanning, skin care]
  food_drink: [restaurant, cafe, café, coffee, bakery, bakeries, bar, pub, pizza, food, catering, dining, takeaway, kebab, brewery, gastropub, sandwich, ice cream, dessert, tea house]
  health_medical: [dentist, dental, clinic, doctor, medical, medicine, pharmacy, physio, physical therap, optician, optometr, chiropract, health, hospital, counsel, psycholog, naturopath, acupuncture, orthodont]
  trades_construction: [plumb, electrician, electrical, roofing, builder, construction, carpent, painter, painting, hvac, heating, locksmith, contractor, flooring, scaffold]
  home_services: [cleaning, gardening, gardener, landscap, pest, moving, removals, handyman, home service]
  pets: [pet, vet, veterinar, dog, animal]
  automotive: [car, auto, automotive, automobile, garage, tyre, tire, mechanic, motor, vehicle]
  real_estate: [real estate, estate agent, property, realtor, letting]
  education: [school, preschool, tutor, academy, training, education, college, nursery, childcare]
  professional_services: [accountant, accounting, lawyer, attorney, law firm, legal, solicitor, consult, insurance, marketing, advertising, agency, architect, financial, information technology, it service, web designer, employment, printing]
  hospitality: [hotel, hostel, guest house, guesthouse, motel, bed and breakfast, lodging, holiday rental, vacation rental, campground]
  fitness_sports: [gym, fitness, yoga, pilates, sport, martial arts, dance, boxing, golf]
  events_entertainment: [event, wedding, photograph, dj, entertainment, venue, musician, party]
  retail: [shop, shopping, store, boutique, retail, florist, jewel, clothing, supermarket]

