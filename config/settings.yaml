# Behaviour settings. Secrets and connection strings live in .env (see .env.example).
# Any value here can be overridden by an environment variable, nested keys joined
# with "__", e.g. WEBSITE__TIMEOUT_SECONDS=20 or BATCH__DRAFTS_PER_DAY=50.

# Keep businesses created / first seen on or after this date.
since: 2018-01-01
# Leads with no known creation date are kept in the DB (age_unknown = true).
# This flag controls whether they appear in exports, the dashboard and daily drafts.
include_unknown_age: true

# Time zone for all Prefect schedules (IANA name). Set TZ in .env to the same value
# (used by the backup container).
timezone: Asia/Karachi

schedules:              # cron expressions, evaluated in `timezone`
  monthly_collect: "0 2 1 * *"   # 1st of month 02:00: collect + refresh
  daily_drafts: "0 7 * * *"      # 07:00: opening dates + Gmail drafts
  gmail_sync: "*/30 * * * *"     # every 30 min
  backup_check: "30 3 * * *"     # 03:30: verify the 03:00 pg_dump from the backup container

batch:
  drafts_per_day: 50
  website_concurrency: 25       # parallel domains being checked; lower on a slow connection
  db_chunk_size: 5000           # rows per insert/upsert batch
  raw_chunk_size: 100000        # rows per raw parquet part file

website:
  timeout_seconds: 12
  # Page requests per domain (home + one contact page). robots.txt is fetched once
  # per domain in addition to this budget.
  max_requests_per_domain: 2
  respect_robots_txt: true
  user_agent: "lead-automation/0.1 (website check)"  # TODO: add your company website
  recheck_after_days: 30
  retry_wait_seconds: 5         # before looking at a failing site a second time
  min_text_chars: 100           # visible text needed for "working" (200 + real content)
  # Open pages that show text only through JavaScript in a headless browser. Needs the
  # "browser" extra (in the Docker image); without it these sites are left as they are.
  browser_fallback: true
  browser_pages: 2              # browser pages open at the same time

outreach:
  # false: drafts are made one by one from the dashboard. true: the daily run also writes up
  # to batch.drafts_per_day drafts by itself.
  auto_drafts: false
  followup_after_days: 6
  default_language: en
  delivery_days: 7
  price: ""                     # TODO: your price / currency

sender:                         # TODO: fill in before creating drafts
  sender_name: "Your Name"
  company: "Clicksone"
  company_website: ""
  company_phone: ""
  company_address: "Islamabad, Pakistan"
  mockup_link: ""

ai:                             # writes the emails; needs GROQ_API_KEY in .env
  model: "openai/gpt-oss-120b"  # on Groq, always tried first
  # Used in this order when Groq fails or its free daily limit is used up. Each one needs
  # <NAME>_API_KEY in .env (GEMINI_API_KEY, OPENROUTER_API_KEY); without a key it is skipped.
  fallbacks:
    - name: gemini              # free key: aistudio.google.com/apikey
      url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
      model: "gemini-flash-lite-latest"  # the full Flash model was often overloaded
      reasoning_effort: "low"
    # - name: openrouter        # free key: openrouter.ai/keys; pick a model marked ":free"
    #   url: "https://openrouter.ai/api/v1/chat/completions"
    #   model: "openai/gpt-oss-120b:free"
    #   reasoning_effort: null

sanctions:
  sdn_url: "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV"
  add_url: "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/ADD.CSV"
  min_score: 92

match:
  name_score_threshold: 90      # rapidfuzz token_sort_ratio for name+50m matching
  shared_key_name_score: 75     # name likeness needed to merge on a shared domain or phone
  geo_radius_m: 50
  max_shared_key_group: 8       # a domain/phone shared by more records is treated as a chain, not a key

registry:
  # Registries mainly date businesses found elsewhere. A new company is also a lead of its own
  # when it lists a phone, email or website; true keeps the uncontactable ones too (millions).
  uncontactable_leads: false

wayback:                        # first capture of a lead's own website, as age evidence
  enabled: true
  daily_limit: 2000             # domains per day, leads with an email first
  seconds_per_request: 1.5      # archive.org asks for about 1 request per second

collect:
  # The monthly run; [] = every country in countries.yaml (all countries are on).
  # To test on a few countries only, list them here, e.g. [GB, IE, MT].
  countries: []
  # When the worker starts and no full collect has finished in the last 35 days (for
  # example a new server with an empty database), collect at once instead of waiting
  # for the 1st of the month. Set COLLECT__ON_START=false in .env on a laptop.
  on_start: true

refresh:
  closed_after_missed_runs: 2
  max_closed_share: 0.2         # more missing than this is a broken source, so nothing is closed

