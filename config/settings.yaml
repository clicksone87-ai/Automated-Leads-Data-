    enabled: true
    release: null               # null = newest release on S3; or pin one, e.g. "2026-11-18.0"
    base_uri: "s3://overturemaps-us-west-2/release"
  foursquare:
    enabled: true               # needs HF_TOKEN in .env (gated dataset, see docs/runbook.md)
    uri: null                   # null = newest Hugging Face release; or a local path/glob
  osm:
    enabled: true
    extracts_dir: null          # Geofabrik .osm.pbf files; null = data/osm
