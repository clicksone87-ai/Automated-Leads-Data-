# Local stack. Ports bind to 127.0.0.1 only.
#   docker compose up -d --build                    # db, prefect-server, worker, backup
#   docker compose --profile dashboard up -d        # + Metabase on http://localhost:3000
#   docker compose run --rm auth                    # one-time Google OAuth sign-in

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-leads}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads}
  POSTGRES_DB: ${POSTGRES_DB:-leads}

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # no arm64 build of this tag; emulated on Apple Silicon
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  prefect-server:
    build: .
    image: lead-automation-worker:latest
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect-data:/home/app/.prefect
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build: .
    image: lead-automation-worker:latest
    restart: unless-stopped
    command: ["python", "-m", "leads.deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leads}:${POSTGRES_PASSWORD:-leads}@db:5432/${POSTGRES_DB:-leads}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ./config:/app/config:ro
      - ./backups:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  # Lead dashboard on http://localhost:3300. Needs only the database.
  app:
    build: .
    image: lead-automation-worker:latest
    restart: unless-stopped
    command: ["leads", "dashboard", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leads}:${POSTGRES_PASSWORD:-leads}@db:5432/${POSTGRES_DB:-leads}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GMAIL_ACCOUNT: ${GMAIL_ACCOUNT:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3300}:3300"
    depends_on:
      db:
        condition: service_healthy

  # One-off Google OAuth sign-in: `docker compose run --rm auth`
  # Same image as the worker, but secrets/ is writable so token.json can be saved.
  auth:
    image: lead-automation-worker:latest
    profiles: ["tools"]
    command: ["python", "-m", "leads.google_auth"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./secrets:/app/secrets
      - ./config:/app/config:ro

  backup:
    image: postgis/postgis:16-3.4  # same image as db: pg_dump of the same version
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-leads}
      PGPASSWORD: ${POSTGRES_PASSWORD:-leads}
      PGDATABASE: ${POSTGRES_DB:-leads}
      TZ: ${TZ:-UTC}
      BACKUP_HOUR: "03"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "backup: nightly pg_dump at $${BACKUP_HOUR}:00 ($${TZ}), keeping $${BACKUP_KEEP_DAYS} days"
        while true; do
          now=$$(date +%s)
          next=$$(date -d "today $${BACKUP_HOUR}:00" +%s)
          if [ "$$now" -ge "$$next" ]; then next=$$(date -d "tomorrow $${BACKUP_HOUR}:00" +%s); fi
          sleep $$((next - now))
          file=/backups/leads_$$(date +%Y%m%d_%H%M).dump
          if pg_dump -Fc -f "$$file.tmp"; then mv "$$file.tmp" "$$file"; echo "backup ok: $$file"; else echo "backup FAILED"; rm -f "$$file.tmp"; fi
          find /backups -name 'leads_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
        done

  dashboard:
    image: metabase/metabase:latest  # TODO: pin a version
    profiles: ["dashboard"]
    restart: unless-stopped
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  prefect-data:
  metabase-data:
